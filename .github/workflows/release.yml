name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag) or tag != 'v' + version:
              raise SystemExit('Release tag must match versionName: v' + version)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_VERSION=' + version + '\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKET_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.POCKET_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKET_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POCKET_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure all four release signing Secrets before publishing. No Debug fallback is allowed.')
          path = Path(os.environ['RUNNER_TEMP']) / 'pocket-release.jks'
          path.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True))
          path.chmod(0o600)
          PY
      - name: Test, lint and build signed Release
        env:
          POCKET_RELEASE_KEYSTORE: ${{ runner.temp }}/pocket-release.jks
          POCKET_RELEASE_STORE_PASSWORD: ${{ secrets.POCKET_RELEASE_STORE_PASSWORD }}
          POCKET_RELEASE_KEY_ALIAS: ${{ secrets.POCKET_RELEASE_KEY_ALIAS }}
          POCKET_RELEASE_KEY_PASSWORD: ${{ secrets.POCKET_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest lintRelease assembleRelease
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='cn.liuheo.twofauth'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$RELEASE_VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo '::error::Release APK must not be debuggable'
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/2FAuth-Pocket-$RELEASE_VERSION.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "2FAuth Pocket $RELEASE_VERSION" --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "dist/2FAuth-Pocket-$RELEASE_VERSION.apk" dist/SHA256SUMS.txt "${args[@]}"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'pocket-release.jks').unlink(missing_ok=True)
          PY
